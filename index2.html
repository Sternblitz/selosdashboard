<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Selo – Auftragsübersicht</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0b10;--panel:#131722;--muted:#96a2b7;--text:#eaf1ff;
    --line:#22283a;--line2:#2a3246;
    --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#6366f1; /* leicht violetter Touch für Selo */
    --accent1:#2b2f45;--accent2:#1a1f33;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--accent2),var(--bg) 30%);color:var(--text);font-family:Inter,system-ui;}
  .wrap{max-width:1100px;margin:28px auto;padding:0 16px;}

  /* Header */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .avatar{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,#0ea5e9,#a78bfa);font-weight:800}
  .title{display:flex;flex-direction:column}
  .title h1{font-size:22px;margin:0;color:#dfe9ff}
  .title .sub{font-size:12px;color:#9fb0c9}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px;
    box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .input{flex:1;min-width:240px;position:relative}
  .input input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line2);
    background:#0e1220;color:var(--text);padding:0 12px 0 42px;font-size:15px;outline:none}
  .input .icon{position:absolute;left:12px;top:50%;translate:0 -50%;opacity:.8}

  button{height:46px;border-radius:12px;border:1px solid var(--line2);
    background:#12182a;color:#eef4ff;padding:0 14px;font-weight:600;cursor:pointer}
  button:hover{border-color:#3b4358}
  .btn-pri{background:linear-gradient(90deg,#161c31,#1f2741);border-color:#3b4358}
  .btn-green{background:#0f1a13;border-color:#145431;color:#b7ffd8}
  .btn-ghost{background:#0f1117}

  .icon-btn{
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line2);background:#0f1117;border-radius:10px;color:#b6c3dc;cursor:pointer
  }
  .icon-btn:hover{border-color:#3b4358;color:#e3ecff}

  .kpis{display:grid;gap:10px;margin-top:10px}
  .kpi{background:#0f1119;border:1px solid var(--line2);border-radius:12px;padding:12px}
  .kpi .label{font-size:12px;color:#9fb0c9}
  .kpi .val{font-size:20px;font-weight:800}
  @media(min-width:640px){ .kpis{grid-template-columns:repeat(4,1fr)} }

  .section h2{font-size:18px;margin:18px 0 10px;color:#dfe9ff}

  .card{background:#0f1119;border:1px solid var(--line2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .head{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
  .title-row{display:flex;flex-direction:column}
  .biz{font-size:16px;font-weight:800;margin:0}
  .addr{font-size:13px;color:#9fb0c9}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#141827;border:1px solid var(--line2);
    padding:4px 6px;border-radius:8px}
  .pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid transparent}
  .pill.active{background:#0e1a31;color:#a7c6ff;border-color:#2b4877}
  .pill.done{background:#102417;color:#87e4b8;border-color:#1b5e3a}
  .pill.paid{background:#24121a;color:#ffc1d0;border-color:#5e1b39}

  .grid{display:grid;gap:8px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:699px){ .g3{grid-template-columns:1fr} }

  .box{background:#0e1119;border:1px solid var(--line2);border-radius:12px;padding:10px}
  .muted{font-size:12px;color:#a4b0c6}
  .num{font-weight:800}

  /* Farb-Helfer */
  .num-red{color:var(--red)}
  .num-green{color:var(--green)}
  .star-red{color:var(--red);font-weight:800}
  .star-green{color:var(--green);font-weight:800}
  .num-amber{color:var(--amber);font-weight:800}  /* GELB für 1–3★ Live Summe */

  .prog{height:8px;background:#131827;border:1px solid #2a3045;border-radius:999px;overflow:hidden}
  .prog > span{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#22c55e)}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .right{display:flex;gap:8px;align-items:center;margin-left:auto}

  .empty{color:#9fb0c9;font-size:14px;margin:6px 0 12px}
  .pac-container{font-family:Inter,system-ui;font-size:14px;border-radius:10px;overflow:hidden}

  @media (max-width:420px){
    button{height:42px;padding:0 10px}
    .input input{height:42px}
    .icon-btn{width:34px;height:34px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Personal Header for Selo -->
  <div class="topbar">
    <div class="avatar">SE</div>
    <div class="title">
      <h1>🚀 Selo Dashboard</h1>
      <div class="sub">Let’s crush it today, Selo. Fokus, Flow, Fortschritt. 💪</div>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="input">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="#97a7c4" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="placeInput" autocomplete="off" placeholder='🔍 Unternehmen suchen – z. B. "Pizzeria Milano, Hannover"' />
      </div>
      <button class="btn-pri" id="refreshAll">🔄 Alle refreshen</button>
      <button class="btn-ghost" id="clearAll">🗑 Alles löschen</button>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="label">Aktive Aufträge</div><div class="val" id="kpiActive">0</div></div>
      <div class="kpi"><div class="label">Ø Fortschritt</div><div class="val" id="kpiAvg">0%</div></div>
      <div class="kpi"><div class="label">Entfernt (1–3★)</div><div class="val" id="kpiDeleted">0</div></div>
      <div class="kpi"><div class="label">Letztes Update</div><div class="val" id="kpiUpdated">–</div></div>
    </div>
  </div>

  <div class="section"><h2>🟢 Aktiv</h2></div>
  <div id="listActive"></div>
  <div id="emptyActive" class="empty" style="display:none">Noch keine Aufträge.</div>

  <div class="section"><h2>✅ Fertig</h2></div>
  <div id="listDone"></div>
  <div id="emptyDone" class="empty" style="display:none">Keine fertigen Aufträge.</div>

  <div class="section"><h2>💰 Bezahlt</h2></div>
  <div id="listPaid"></div>
  <div id="emptyPaid" class="empty" style="display:none">Noch nichts bezahlt.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ===================== CONFIG (SELO) ===================== */
// Google Key bleibt gleich wie bei dir:
const GOOGLE_KEY           = 'AIzaSyAlqOEqk3OkF1klDuMutYdePgzY_2DDfgE';
// Selo's Supabase:
const SUPABASE_URL         = 'https://efttmhmfkyvymqbfztil.supabase.co';
const SUPABASE_ANON_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmdHRtaG1ma3l2eW1xYmZ6dGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5NjgzMjUsImV4cCI6MjA3NDU0NDMyNX0.qo0r5YUoOvSadSzNhwWvCa2PCItYPX_nhwLx3cqKsSo';

const REVIEW_API           = 'https://sternblitz-review-simulator-cwnz.vercel.app/api/reviews';
const TABLE                = 'orders_app';
const STORAGE_FALLBACK_KEY = 'sb_orders_v3_backup_selo';
const ENABLE_REALTIME      = true;

/* ============== Supabase Client ============== */
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== STATE ===================== */
let orders = [];
const fmt0 = n => Number(n||0).toLocaleString('de-DE');
const fmt1 = n => Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const nowISO = () => new Date().toISOString();
const toDate = iso => iso ? new Date(iso) : null;

function saveBackup(){ localStorage.setItem(STORAGE_FALLBACK_KEY, JSON.stringify(orders)); }
function loadBackup(){ try{ orders = JSON.parse(localStorage.getItem(STORAGE_FALLBACK_KEY)||'[]'); }catch{} }

const sumBad = (o, sfx='start') => (o['bad1_'+sfx]||0)+(o['bad2_'+sfx]||0)+(o['bad3_'+sfx]||0);
const deletedCount = o => Math.max(0, sumBad(o,'start') - sumBad(o,'live'));
const progressRatio = o => (o.target_start>0) ? Math.min(1, deletedCount(o)/o.target_start) : 0;

function daysSince(iso){
  if(!iso) return '';
  const start = new Date(iso);
  const diff = Math.floor((Date.now() - start.getTime()) / (1000*60*60*24));
  if(diff<=0) return "✅ Heute angelegt";
  if(diff===1) return "⏳ Vor 1 Tag";
  if(diff>=7) return `⚠️ Überfällig: seit ${diff} Tagen`;
  return `⏳ Vor ${diff} Tagen`;
}

/* ================== DB OPS (JSON) ================== */
async function dbList(){
  const { data, error } = await supa.from(TABLE).select('id,data').order('created_at',{ascending:false});
  if(error) throw error;
  return data.map(r => ({ ...r.data, db_id: r.id }));
}
async function dbInsert(order){
  const payload = { data: order };
  const { data, error } = await supa.from(TABLE).insert(payload).select('id').single();
  if(error) throw error;
  return data.id;
}
async function dbUpdate(order){
  const { db_id, ...rest } = order;
  const payload = { data: rest, updated_at: nowISO() };
  const { error } = await supa.from(TABLE).update(payload).eq('id', db_id);
  if(error) throw error;
}
async function dbDelete(db_id){
  const { error } = await supa.from(TABLE).delete().eq('id', db_id);
  if(error) throw error;
}

/* ================== API / Fallback ================== */
function seedFrom(str){
  let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; }
  return (min,max)=>{ h = (h*1664525 + 1013904223) | 0; const rnd=((h>>>0)/4294967295); return Math.floor(min + rnd*(max-min+1)); };
}
function synthReviews(name,address){
  const rand = seedFrom((name||'')+'|'+(address||''));
  const total = rand(80, 1400);
  const avg   = (rand(36, 48) / 10);
  let p5 = Math.min(0.8, Math.max(0.25, (avg-3)/2));
  let p4 = Math.min(0.55, Math.max(0.15, 0.35 + (avg-4)*0.4));
  let residual = Math.max(0, 1 - p5 - p4);
  let p3 = residual * 0.35;
  let p2 = residual * 0.25;
  let p1 = residual * 0.40;
  let b5 = Math.round(total*p5);
  let b4 = Math.round(total*p4);
  let b3 = Math.round(total*p3);
  let b2 = Math.round(total*p2);
  let b1 = Math.max(0, total - b5 - b4 - b3 - b2);
  return { averageRating: avg, totalReviews: total, breakdown: {1:b1,2:b2,3:b3,4:b4,5:b5}, __demo: true };
}
async function fetchReviews(name,address){
  try{
    const url = `${'https://sternblitz-review-simulator-cwnz.vercel.app/api/reviews'}?name=${encodeURIComponent(name)}&address=${encodeURIComponent(address||'')}`;
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    if (!data || typeof data.totalReviews!=='number') throw new Error('Bad payload');
    data.__demo = false;
    return data;
  }catch(e){
    return synthReviews(name,address);
  }
}

/* ================== RENDER ================== */
function cardHTML(o, section){
  const startedTxt = toDate(o.started_at)?.toLocaleString('de-DE') || '—';
  const updatedTxt = toDate(o.last_refresh_at)?.toLocaleString('de-DE') || '—';
  const sinceTxt   = daysSince(o.started_at);

  const del  = deletedCount(o);
  const prog = Math.round(progressRatio(o)*100);

  const statusClass = o.status==='active' ? 'active' : o.status==='done' ? 'done' : 'paid';
  const actions = section==='active'
    ? `<button class="btn-pri" onclick="refreshOne('${o.db_id}')">🔄 Refresh</button>
       <button class="btn-green" onclick="markDone('${o.db_id}')">✅ Done</button>`
    : section==='done'
    ? `<button class="btn-pri" onclick="markPaid('${o.db_id}')">💰 Paid</button>
       <button onclick="markActive('${o.db_id}')">↩️ Zurück</button>`
    : `<button onclick="markDone('${o.db_id}')">↩️ Zurück zu Done</button>`;

  /* Start-Box: Ziel fett/rot, Ø rot mit ⭐️ */
  const startBox = `
    <div class="box">
      <div class="muted">Start</div>
      <div style="margin-top:8px">
        <div class="muted">🎯 Ziel (1–3★)</div>
        <div class="num num-red" style="font-size:20px">${fmt0(o.target_start)}</div>
      </div>
      <div class="grid g2" style="margin-top:10px">
        <div><span class="muted">Bewertungen gesamt</span><div class="num">${fmt0(o.total_start)}</div></div>
        <div><span class="muted">Ø</span><div class="star-red">⭐️ ${fmt1(o.rating_start)}</div></div>
      </div>
    </div>
  `;

  /* Live-Box: Ø grün mit ⭐️ */
  const liveBox = `
    <div class="box">
      <div class="muted">Live</div>
      <div class="grid g2" style="margin-top:6px">
        <div><span class="muted">Bewertungen</span><div class="num">${fmt0(o.total_live ?? o.total_start)}</div></div>
        <div><span class="muted">Ø</span><div class="star-green">⭐️ ${fmt1(o.rating_live ?? o.rating_start)}</div></div>
      </div>
      <div class="muted" style="margin-top:6px">🧹 Δ entfernt: <b>${fmt0(del)}</b></div>
    </div>
  `;

  /* 1–3★ Live: Summe GELB + Aufschlüsselung */
  const badSumLive = (o.bad1_live||0)+(o.bad2_live||0)+(o.bad3_live||0);
  const breakdownBox = `
    <div class="box">
      <div class="muted">1–3★ Live</div>
      <div class="num num-amber" style="font-size:20px;margin-top:8px">🟡 ${fmt0(badSumLive)}</div>
      <div class="grid g3" style="margin-top:8px">
        <span class="badge">1★ <b>${fmt0(o.bad1_live||0)}</b></span>
        <span class="badge">2★ <b>${fmt0(o.bad2_live||0)}</b></span>
        <span class="badge">3★ <b>${fmt0(o.bad3_live||0)}</b></span>
      </div>
    </div>
  `;

  return `
  <div class="card">
    <div class="head">
      <div class="title-row">
        <h3 class="biz">🟣 ${o.client_name}</h3>
        <div class="addr">📍 ${o.query_address||''}</div>
      </div>
      <div class="right">
        <span class="pill ${statusClass}">${o.status.toUpperCase()}</span>
        <button class="icon-btn" title="Diesen Auftrag löschen" onclick="deleteOne('${o.db_id}')">🗑</button>
      </div>
    </div>

    <div class="grid g3">
      ${startBox}
      ${liveBox}
      ${breakdownBox}
    </div>

    <div>
      <div class="prog" style="margin:6px 0 4px 0"><span style="width:${prog}%"></span></div>
      <div class="muted">${prog}% Fortschritt • zuletzt: ${updatedTxt} • angelegt: ${startedTxt}</div>
      <div class="muted" style="margin-top:4px">${sinceTxt}</div>
    </div>

    <div class="actions">
      ${actions}
    </div>
  </div>`;
}

function render(){
  const active = orders.filter(o=>o.status==='active').sort((a,b)=>new Date(b.started_at)-new Date(a.started_at));
  const done   = orders.filter(o=>o.status==='done').sort((a,b)=>new Date(b.started_at)-new Date(a.started_at));
  const paid   = orders.filter(o=>o.status==='paid').sort((a,b)=>new Date(b.started_at)-new Date(a.started_at));

  document.getElementById('listActive').innerHTML = active.map(o=>cardHTML(o,'active')).join('');
  document.getElementById('listDone').innerHTML   = done.map(o=>cardHTML(o,'done')).join('');
  document.getElementById('listPaid').innerHTML   = paid.map(o=>cardHTML(o,'paid')).join('');

  document.getElementById('emptyActive').style.display = active.length?'none':'block';
  document.getElementById('emptyDone').style.display   = done.length?'none':'block';
  document.getElementById('emptyPaid').style.display   = paid.length?'none':'block';

  const avg = active.length ? Math.round(active.map(progressRatio).reduce((a,b)=>a+b,0)/active.length*100) : 0;
  const deletedSum = orders.map(deletedCount).reduce((a,b)=>a+b,0);
  document.getElementById('kpiActive').textContent  = active.length;
  document.getElementById('kpiAvg').textContent     = avg+'%';
  document.getElementById('kpiDeleted').textContent = fmt0(deletedSum);
  document.getElementById('kpiUpdated').textContent = new Date().toLocaleString('de-DE');
}

/* ================== CRUD / ACTIONS ================== */
async function addOrderFromPlace(place){
  const name = place.name;
  const address = place.formatted_address || '';
  const d = await fetchReviews(name,address);
  const b = d.breakdown || {};
  const b1 = Number(b[1]||0), b2 = Number(b[2]||0), b3 = Number(b[3]||0);

  const o = {
    client_name: name,
    place_id: place.place_id || '',
    query_name: name,
    query_address: address,
    started_at: nowISO(),
    status: 'active',
    last_refresh_at: null,

    total_start: Number(d.totalReviews||0),
    rating_start: Number(d.averageRating||0),
    target_start: b1+b2+b3,
    bad1_start: b1, bad2_start: b2, bad3_start: b3,

    total_live: Number(d.totalReviews||0),
    rating_live: Number(d.averageRating||0),
    bad1_live: b1, bad2_live: b2, bad3_live: b3
  };

  const db_id = await dbInsert(o);
  orders.unshift({ ...o, db_id });
  saveBackup(); render();
}

async function refreshOne(db_id){
  const o = orders.find(x=>x.db_id===db_id); if(!o) return;
  const d = await fetchReviews(o.query_name,o.query_address);
  const b = d.breakdown || {};
  o.total_live = Number(d.totalReviews||0);
  o.rating_live= Number(d.averageRating||0);
  o.bad1_live  = Number(b[1]||0);
  o.bad2_live  = Number(b[2]||0);
  o.bad3_live  = Number(b[3]||0);
  o.last_refresh_at = nowISO();
  await dbUpdate(o);
  saveBackup(); render();
}
async function refreshAll(){
  const act = orders.filter(o=>o.status==='active');
  for(const o of act){ await refreshOne(o.db_id); }
}

async function markDone(db_id){ const o=orders.find(x=>x.db_id===db_id); if(!o) return; o.status='done'; await dbUpdate(o); saveBackup(); render(); }
async function markPaid(db_id){ const o=orders.find(x=>x.db_id===db_id); if(!o) return; o.status='paid'; await dbUpdate(o); saveBackup(); render(); }
async function markActive(db_id){ const o=orders.find(x=>x.db_id===db_id); if(!o) return; o.status='active'; await dbUpdate(o); saveBackup(); render(); }

async function deleteOne(db_id){
  const o = orders.find(x=>x.db_id===db_id);
  const name = o?.client_name ? `„${o.client_name}“` : 'diesen Auftrag';
  if(!confirm(`Wirklich ${name} löschen?`)) return;
  try{
    await dbDelete(db_id);
    orders = orders.filter(x=>x.db_id!==db_id);
    saveBackup();
    render();
  }catch(e){
    alert('Löschen fehlgeschlagen: ' + (e?.message||e));
  }
}

/* ================== UI HOOKS ================== */
document.getElementById('refreshAll').addEventListener('click', refreshAll);
document.getElementById('clearAll').addEventListener('click', async ()=>{
  if(!confirm('Wirklich alle Orders in der Cloud löschen?')) return;
  try{
    await supa.from(TABLE).delete().neq('id','00000000-0000-0000-0000-000000000000');
  }catch(e){ alert('Server-Löschung fehlgeschlagen: ' + (e?.message||e)); }
  orders=[]; saveBackup(); render();
});

/* ================== GOOGLE PLACES ================== */
function initPlaces(){
  const el = document.getElementById('placeInput');
  const ac = new google.maps.places.Autocomplete(el,{
    types:['establishment'],
    fields:['place_id','name','formatted_address']
  });
  ac.addListener('place_changed', async ()=>{
    const place = ac.getPlace();
    if(!place || !place.name) return;
    el.value = '';
    try{ await addOrderFromPlace(place); }
    catch(err){ alert('Fehler beim Anlegen: '+(err?.message||err)); }
  });
}
(function loadGoogle(){
  const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${GOOGLE_KEY}&libraries=places&callback=initPlaces`;
  s.async=true; s.defer=true; document.head.appendChild(s);
})();

/* ================== BOOT ================== */
async function loadFromCloud(){
  orders = await dbList();
  saveBackup();
  render();
}

(async function boot(){
  try{
    await loadFromCloud();
  }catch(e){
    loadBackup();
    console.warn('Supabase nicht erreichbar, lade lokalen Backup:', e?.message||e);
    render();
  }

  if (ENABLE_REALTIME){
    try{
      const channel = supa.channel('orders_app_changes');
      channel
        .on('postgres_changes',
            { event: '*', schema: 'public', table: TABLE },
            async () => { try { await loadFromCloud(); } catch{} })
        .subscribe();
    }catch(e){
      console.warn('Realtime konnte nicht abonniert werden:', e?.message||e);
    }
  }
})();
